name: Pull Request Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check newsroom JavaScript syntax
        run: node --check docs/newsroom-v1.js
      - name: Run V2 focused tests
        if: github.head_ref == 'design/newsroom-v2-2026-09-07'
        run: >-
          python -m pytest -q
          tests/test_newsroom_raw_intake.py
          tests/test_newsroom_models.py
          tests/test_newsroom_normalize.py
          tests/test_newsroom_fingerprint.py
          tests/test_event_ledger.py
          tests/test_newsroom_decision.py
          tests/test_newsroom_eligibility.py
          tests/test_panel_live_feed.py
          tests/test_newsroom_v2_integration.py
          tests/test_newsroom_v2_eligibility_integration.py
          tests/test_newsroom_publisher.py
          tests/test_runtime_v2.py
          tests/test_truth_social.py
      - name: Run live V2 shadow cycle
        if: github.head_ref == 'design/newsroom-v2-2026-09-07'
        env:
          NEWSROOM_V2_FRESHNESS_HOURS: "6"
          NEWSROOM_V2_PANEL_MAX_RECORDS: "500"
        run: python -m src.newsroom_v2_runtime
      - name: Verify V2 shadow made no Telegram writes
        if: github.head_ref == 'design/newsroom-v2-2026-09-07'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('data/panel_live_feed.json').read_text(encoding='utf-8'))
          assert isinstance(rows, list)
          assert all(row.get('telegram_message_id') in (None, '') for row in rows)
          print('SHADOW_FEED_RECORDS', len(rows))
          PY
      - name: Run full regression suite
        run: python -m pytest -q
