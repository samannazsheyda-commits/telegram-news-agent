name: Bikhabar Urgent Broadcast

on:
  push:
    branches: [main]
    paths:
      - "data/urgent_broadcast.json"

permissions:
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install urgent media dependencies
        run: python -m pip install --quiet requests jdatetime
      - name: Send urgent Telegram posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import time
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import jdatetime
          import requests

          payload = json.loads(Path('data/urgent_broadcast.json').read_text(encoding='utf-8'))
          token = os.environ.get('TELEGRAM_BOT_TOKEN','').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID','@bikhabaar').strip()
          if not token:
              raise SystemExit('missing TELEGRAM_BOT_TOKEN')

          session = requests.Session()
          weekdays = ['دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه','یکشنبه']
          months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند']

          def now_fa():
              now = datetime.now(ZoneInfo('Asia/Tehran'))
              jd = jdatetime.date.fromgregorian(date=now.date())
              return f"{weekdays[now.weekday()]} {jd.day} {months[jd.month-1]} {jd.year} — {now:%H:%M}"

          def api(method, **data):
              r = session.post(f'https://api.telegram.org/bot{token}/{method}', data=data, timeout=60)
              if not r.ok:
                  raise RuntimeError(f'{method} HTTP {r.status_code}: {r.text[:500]}')
              out = r.json()
              if not out.get('ok'):
                  raise RuntimeError(f'{method}: {out}')
              return out

          for text in payload.get('messages') or []:
              api('sendMessage', chat_id=chat_id, text=str(text), parse_mode='HTML', disable_web_page_preview='true')
              time.sleep(2)

          for post in payload.get('telegram_video_posts') or []:
              if isinstance(post, str):
                  post = {'url': post}
              url = str(post.get('url') or '').strip()
              match = re.search(r'https?://t\.me/(?:s/)?([A-Za-z0-9_]+)/([0-9]+)', url)
              if not match:
                  raise RuntimeError(f'invalid_telegram_post_url: {url}')
              source_chat = '@' + match.group(1)
              message_id = int(match.group(2))
              title = str(post.get('title') or '🚨🚀 <b>خبر فوری | ویدیوی تازه از تحولات موشکی منطقه</b>').strip()
              body = str(post.get('body') or 'ویدیوی تازه مرتبط با تحولات موشکی منطقه منتشر شده است.').strip()
              hashtags = str(post.get('hashtags') or '#موشک #ایران').strip()
              caption = (
                  f"{title}\n\n{html.escape(body)}\n\n"
                  f"⏰ {now_fa()}\n"
                  f"📌 <a href=\"{html.escape(url, quote=True)}\">لینک منبع خبر</a>\n\n"
                  f"📡 <a href=\"https://t.me/bikhabaar\">بی‌خبر</a> ←\nمانیتور تحولات ایران\n"
                  f"🇮🇷 🚀\n{html.escape(hashtags)}"
              )
              api(
                  'copyMessage',
                  chat_id=chat_id,
                  from_chat_id=source_chat,
                  message_id=message_id,
                  caption=caption,
                  parse_mode='HTML',
                  show_caption_above_media='false',
              )
              time.sleep(2)
          PY
