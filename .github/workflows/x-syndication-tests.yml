name: X Syndication Tests

on:
  push:
    branches:
      - fix/x-direct-syndication-active

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Live Jina X profile diagnostic
        run: |
          python - <<'PY'
          import requests, re
          url = 'https://r.jina.ai/https://x.com/Reuters'
          r = requests.get(url, headers={'User-Agent':'Mozilla/5.0','X-Return-Format':'markdown'}, timeout=30)
          print('status', r.status_code, 'bytes', len(r.text))
          print(r.text[:6000])
          r.raise_for_status()
          links = re.findall(r'https://x\.com/Reuters/status/(\d+)', r.text, re.I)
          print('status_links', len(set(links)), sorted(set(links))[-5:])
          assert links, 'Jina profile returned no tweet status links'
          PY
      - run: python -m pytest -q
