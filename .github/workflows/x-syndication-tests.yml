name: X Syndication Tests

on:
  push:
    branches:
      - fix/x-direct-syndication-active

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Live TwStalker X profile diagnostic
        run: |
          python - <<'PY'
          import requests, re
          url = 'https://twstalker.com/Reuters'
          r = requests.get(url, headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'}, timeout=30)
          print('status', r.status_code, 'bytes', len(r.text), 'final', r.url)
          print(r.text[:8000])
          r.raise_for_status()
          links = re.findall(r'(?:https://twstalker\.com)?/Reuters/status/(\d+)', r.text, re.I)
          print('status_links', len(set(links)), list(dict.fromkeys(links))[:10])
          assert links, 'TwStalker profile returned no tweet status links'
          PY
      - run: python -m pytest -q
