name: X Syndication Tests

on:
  push:
    branches:
      - fix/x-direct-syndication-active

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Live search X status diagnostic
        run: |
          python - <<'PY'
          import requests, re, urllib.parse
          q = 'site:x.com/Reuters/status Iran Reuters'
          ua = {'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36'}
          urls = [
              'https://www.google.com/search?num=20&tbs=qdr:d&q=' + urllib.parse.quote(q),
              'https://html.duckduckgo.com/html/?q=' + urllib.parse.quote(q),
          ]
          found = []
          for url in urls:
              try:
                  r = requests.get(url, headers=ua, timeout=30)
                  print('URL', url.split('?')[0], 'status', r.status_code, 'bytes', len(r.text))
                  print(r.text[:3500])
                  links = re.findall(r'https?://(?:www\.)?x\.com/Reuters/status/\d+', r.text, re.I)
                  print('xlinks', list(dict.fromkeys(links))[:10])
                  found.extend(links)
              except Exception as exc:
                  print('ERR', url, exc)
          assert found, 'Google/DDG returned no direct Reuters X status links'
          PY
      - run: python -m pytest -q
