name: X Syndication Tests

on:
  push:
    branches:
      - fix/x-direct-syndication-active

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Live Bing X search diagnostic
        run: |
          python - <<'PY'
          import requests, re, urllib.parse, xml.etree.ElementTree as ET
          q = 'site:x.com/Reuters/status Iran OR Iranian OR Hormuz'
          url = 'https://www.bing.com/search?format=rss&q=' + urllib.parse.quote(q)
          r = requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=30)
          print('status', r.status_code, 'bytes', len(r.content), 'final', r.url)
          print(r.text[:5000])
          r.raise_for_status()
          root = ET.fromstring(r.content)
          links = [(n.findtext('title') or '', n.findtext('link') or '', n.findtext('pubDate') or '') for n in root.findall('.//item')]
          print('items', links[:10])
          xlinks = [link for _, link, _ in links if re.search(r'https?://(?:www\.)?x\.com/Reuters/status/\d+', link, re.I)]
          assert xlinks, 'Bing RSS returned no direct Reuters X status links'
          PY
      - run: python -m pytest -q
