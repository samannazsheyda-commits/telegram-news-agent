name: X Syndication Tests

on:
  push:
    branches:
      - fix/x-direct-syndication-active

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Live FxTwitter timeline diagnostic
        run: |
          python - <<'PY'
          import requests, json
          url = 'https://api.fxtwitter.com/2/profile/Reuters/statuses?count=20'
          r = requests.get(url, headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'}, timeout=30)
          print('status', r.status_code, 'type', r.headers.get('content-type'), 'bytes', len(r.content))
          print(r.text[:10000])
          r.raise_for_status()
          data = r.json()
          results = data.get('results') or []
          assert results, 'FxTwitter v2 returned no statuses'
          first = results[0]
          print('first keys', sorted(first.keys()))
          print('first', json.dumps(first, ensure_ascii=False)[:4000])
          assert str(first.get('id') or first.get('id_str') or ''), 'missing status id'
          assert str(first.get('text') or first.get('full_text') or first.get('raw_text') or ''), 'missing status text'
          PY
      - run: python -m pytest -q tests/test_x_syndication.py tests/test_expanded_x_monitoring.py tests/test_x_publish_all.py
