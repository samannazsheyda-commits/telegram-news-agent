name: X Syndication Tests

on:
  push:
    branches:
      - fix/x-direct-syndication-active

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Probe public X proxy APIs
        run: |
          python - <<'PY'
          import requests
          urls = [
            'https://api.fxtwitter.com/Reuters',
            'https://api.fxtwitter.com/user/Reuters',
            'https://api.fxtwitter.com/users/Reuters',
            'https://api.vxtwitter.com/Reuters',
            'https://api.vxtwitter.com/user/Reuters',
            'https://api.vxtwitter.com/users/Reuters',
            'https://twitterviewer.io/profile/Reuters',
          ]
          ok = []
          for url in urls:
              try:
                  r = requests.get(url, headers={'User-Agent':'Mozilla/5.0'}, timeout=20)
                  print('\nURL', url, 'status', r.status_code, 'type', r.headers.get('content-type'), 'bytes', len(r.content))
                  print(r.text[:3000])
                  if r.status_code == 200 and ('status' in r.text.lower() or 'tweet' in r.text.lower()):
                      ok.append(url)
              except Exception as exc:
                  print('ERR', url, exc)
          assert ok, 'No usable public X proxy profile endpoint found'
          print('usable', ok)
          PY
      - run: python -m pytest -q
