name: Publish Latest Trump Image Truth

on:
  push:
    branches: [main]
    paths:
      - ".truth-image-now"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish missed captionless Trump Iran image Truth
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: |
          python - <<'PY'
          import os, requests

          photo = "https://truth-archive.us-iad-1.linodeobjects.com/attachments/17977/ef4da83f66017163-4c1b09bf9dd9.jpg"
          truth_url = "https://truthsocial.com/@realDonaldTrump/117206799377569441"
          caption = (
              '<b>پست جدید ترامپ در تروت سوشال</b>\n\n'
              '<a href="' + truth_url + '">لینک پست اصلی</a>\n\n'
              '📡 <a href="https://t.me/bikhabaar">بی‌خبر</a> ←\n'
              'مانیتور تحولات ایران'
          )

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          res = requests.post(
              f"https://api.telegram.org/bot{token}/sendPhoto",
              json={"chat_id": chat, "photo": photo, "caption": caption, "parse_mode": "HTML"},
              timeout=30,
          )
          res.raise_for_status()
          data = res.json()
          if not data.get("ok"):
              raise SystemExit(f"Telegram rejected: {data}")
          print("TRUTH_IMAGE_PUBLISHED", truth_url)
          PY
