name: Publish Trump Iran Image Truths

on:
  push:
    branches: [main]
    paths:
      - ".truth-image-now"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - run: python -m playwright install chromium
      - name: Republish both Trump Iran image Truths
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: |
          python - <<'PY'
          import os, requests, asyncio
          from pathlib import Path
          from playwright.async_api import async_playwright

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          endpoint = f"https://api.telegram.org/bot{token}/sendPhoto"

          def caption(url):
              return (
                  '<b>پست جدید ترامپ در تروت سوشال</b>\n\n'
                  f'<a href="{url}">لینک پست اصلی</a>\n\n'
                  '📡 <a href="https://t.me/bikhabaar">بی‌خبر</a> ←\n'
                  'مانیتور تحولات ایران'
              )

          def send_url(photo, url):
              r = requests.post(endpoint, json={
                  "chat_id": chat,
                  "photo": photo,
                  "caption": caption(url),
                  "parse_mode": "HTML",
              }, timeout=45)
              r.raise_for_status()
              data = r.json()
              if not data.get("ok"):
                  raise RuntimeError(data)
              print("PUBLISHED", url)

          def send_file(path, url):
              with open(path, "rb") as f:
                  r = requests.post(endpoint, data={
                      "chat_id": chat,
                      "caption": caption(url),
                      "parse_mode": "HTML",
                  }, files={"photo": (Path(path).name, f, "image/png")}, timeout=60)
              r.raise_for_status()
              data = r.json()
              if not data.get("ok"):
                  raise RuntimeError(data)
              print("PUBLISHED", url)

          old_url = "https://truthsocial.com/@realDonaldTrump/117206799377569441"
          old_photo = "https://truth-archive.us-iad-1.linodeobjects.com/attachments/17977/ef4da83f66017163-4c1b09bf9dd9.jpg"
          send_url(old_photo, old_url)

          latest_url = "https://truthsocial.com/@realDonaldTrump/117225346749407203"
          out = "/tmp/latest-trump-truth.png"

          async def shot():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(viewport={"width": 690, "height": 1536}, device_scale_factor=1)
                  await page.goto(latest_url, wait_until="domcontentloaded", timeout=60000)
                  await page.wait_for_timeout(9000)
                  await page.screenshot(path=out, full_page=False)
                  await browser.close()

          asyncio.run(shot())
          send_file(out, latest_url)
          PY
