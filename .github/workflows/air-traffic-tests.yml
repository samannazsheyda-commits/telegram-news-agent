name: Air Traffic Tests

on:
  push:
    branches:
      - feat/mideast-air-traffic-work2
    paths:
      - "src/air_traffic.py"
      - "tests/test_air_traffic.py"
      - "requirements*.txt"
      - ".github/workflows/air-traffic-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_air_traffic.py
      - name: Live ADS-B + map smoke test
        run: python -m src.air_traffic --output /tmp/middle-east-air-traffic.png
      - uses: actions/upload-artifact@v4
        with:
          name: middle-east-air-traffic-smoke
          path: /tmp/middle-east-air-traffic.png
