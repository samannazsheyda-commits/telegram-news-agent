name: Air Traffic Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/air_traffic.py"
      - "tests/test_air_traffic.py"
      - "deploy/bikhabar-air-traffic.*"
      - "deploy/install-vps.sh"
      - "deploy/update-vps.sh"
      - "requirements*.txt"
      - ".github/workflows/air-traffic*.yml"
  pull_request:
    paths:
      - "src/air_traffic.py"
      - "tests/test_air_traffic.py"
      - "deploy/bikhabar-air-traffic.*"
      - "deploy/install-vps.sh"
      - "deploy/update-vps.sh"
      - "requirements*.txt"
      - ".github/workflows/air-traffic*.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_air_traffic.py
      - name: Live ADS-B + approved crop smoke test
        run: python -m src.air_traffic --output /tmp/iran-region-live-air-traffic.png
      - uses: actions/upload-artifact@v4
        with:
          name: iran-region-live-air-traffic-smoke
          path: /tmp/iran-region-live-air-traffic.png
          if-no-files-found: error
