name: X Only Newsroom Tests

on:
  push:
    branches:
      - fix/x-only-newsroom

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run X-only regression tests
        run: python -m pytest -q tests/test_x_priority_sources.py
