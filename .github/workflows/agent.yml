name: Telegram News Agent CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "panel/**"
      - "tests/**"
      - "deploy/**"
      - "requirements*.txt"
      - ".github/workflows/agent.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "panel/**"
      - "tests/**"
      - "deploy/**"
      - "requirements*.txt"
      - ".github/workflows/agent.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install-vps.sh
          bash -n deploy/update-vps.sh

      - name: Promote tested main to production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push origin HEAD:refs/heads/production --force
