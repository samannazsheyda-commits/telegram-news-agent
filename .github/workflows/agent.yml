name: Telegram News Agent

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: python -m src.main

      - name: Persist state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "telegram-news-agent[bot]"
          git config user.email "telegram-news-agent[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update agent state"
          git pull --rebase
          git push
