name: Telegram News Agent

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "panel/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/agent.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run near-realtime monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
          POLL_SECONDS: "60"
          SESSION_SECONDS: "240"
        run: python -m src.runtime --monitor

      - name: Persist runtime data
        if: always()
        run: |
          mkdir -p /tmp/runtime-snapshot/data
          cp state.json /tmp/runtime-snapshot/state.json
          cp data/editorial_queue.json /tmp/runtime-snapshot/data/editorial_queue.json
          cp data/editorial_history.json /tmp/runtime-snapshot/data/editorial_history.json

          git fetch origin main
          git reset --hard origin/main
          python -m src.persist_merge /tmp/runtime-snapshot

          if git diff --quiet -- state.json data/editorial_queue.json data/editorial_history.json; then
            echo "No runtime data changes"
            exit 0
          fi

          git config user.name "telegram-news-agent[bot]"
          git config user.email "telegram-news-agent[bot]@users.noreply.github.com"
          git add state.json data/editorial_queue.json data/editorial_history.json
          git commit -m "chore: update agent runtime data"
          git push
