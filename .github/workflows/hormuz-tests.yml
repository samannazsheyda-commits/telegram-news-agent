name: Hormuz Report Tests

on:
  push:
    branches:
      - feat/daily-hormuz-traffic-report

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run Hormuz tests
        run: python -m pytest -q tests/test_hormuz_report.py
