name: Browser Panel Check

on:
  push:
    branches: [main]
    paths:
      - "src/panel_command.py"
      - "src/manual_publish.py"
      - "dashboard/**"
      - ".github/workflows/panel-command.yml"
      - ".github/workflows/panel-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_manual_publish.py tests/test_static_dashboard.py
      - run: python -m src.panel_command --help
