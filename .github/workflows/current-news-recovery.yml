name: Recover Verified Current Iran News

on:
  push:
    branches: [main]
    paths:
      - ".recovery-current-news"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish only missing verified current stories
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: |
          python - <<'PY'
          import html
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          channel_html = requests.get("https://t.me/s/bikhabaar", timeout=20).text

          posts = [
              {
                  "kind": "photo",
                  "source": "https://truthsocial.com/@realDonaldTrump/117230287806050615",
                  "guard": "117230287806050615",
                  "photo": "https://truth-archive.us-iad-1.linodeobjects.com/attachments/18053/a4431d123721b49e-f839046828a7.jpg",
                  "text": "<b>پست جدید ترامپ درباره نیروی دریایی ایران</b>\n\nترامپ در تروث سوشال تصویری با عنوان «Iran’s Navy» منتشر کرد که ناوهای غرق‌شده را در کف دریا نشان می‌دهد.\n\n🕒 زمان منبع: ۷ سپتامبر ۲۰۲۶، ۱۰:۴۳ صبح به وقت شرق آمریکا\n📌 <a href=\"https://truthsocial.com/@realDonaldTrump/117230287806050615\">پست اصلی ترامپ</a>\n\n📡 <a href=\"https://t.me/bikhabaar\">بی‌خبر</a> ←\nمانیتور تحولات ایران",
              },
              {
                  "kind": "photo",
                  "source": "https://truthsocial.com/@realDonaldTrump/117230287192828119",
                  "guard": "117230287192828119",
                  "photo": "https://truth-archive.us-iad-1.linodeobjects.com/attachments/18054/550db2b60087c7ad-fa281ff9c79b.jpg",
                  "text": "<b>دومین پست ترامپ درباره نیروی دریایی ایران</b>\n\nترامپ در همان دقیقه تصویر دیگری با همان عنوان «Iran’s Navy» منتشر کرد؛ این تصویر نیز ناوهای غرق‌شده را در کف دریا نشان می‌دهد و یک پست مستقل در تروث سوشال است.\n\n🕒 زمان منبع: ۷ سپتامبر ۲۰۲۶، ۱۰:۴۳ صبح به وقت شرق آمریکا\n📌 <a href=\"https://truthsocial.com/@realDonaldTrump/117230287192828119\">پست اصلی ترامپ</a>\n\n📡 <a href=\"https://t.me/bikhabaar\">بی‌خبر</a> ←\nمانیتور تحولات ایران",
              },
              {
                  "kind": "text",
                  "source": "https://www.reuters.com/world/middle-east/iran-says-announce-new-restricted-zone-gulf-coming-days-2026-09-07/",
                  "guard": "iran-says-announce-new-restricted-zone-gulf-coming-days-2026-09-07",
                  "text": "<b>رویترز: ایران از ایجاد منطقه محدود جدید در خلیج خبر داد</b>\n\nرویترز گزارش داده تهران قصد دارد به‌زودی یک منطقه محدود جدید در خلیج و یک مسیر تازه کشتیرانی در تنگه هرمز اعلام کند. محسن رضایی گفته کشتی‌هایی که وارد منطقه اعلام‌شده شوند در فهرست تحریم ایران قرار می‌گیرند. محمدباقر قالیباف نیز هشدار داده در صورت حمله تازه آمریکا، زیرساخت‌های انرژی و منافع نفت و گاز آمریکا در منطقه در معرض پاسخ ایران خواهند بود.\n\n🕒 زمان منبع: ۷ سپتامبر ۲۰۲۶، ۰۶:۵۷ UTC\n📌 <a href=\"https://www.reuters.com/world/middle-east/iran-says-announce-new-restricted-zone-gulf-coming-days-2026-09-07/\">منبع: Reuters</a>\n\n📡 <a href=\"https://t.me/bikhabaar\">بی‌خبر</a> ←\nمانیتور تحولات ایران",
              },
              {
                  "kind": "text",
                  "source": "https://www.reuters.com/world/middle-east/iran-says-announce-new-restricted-zone-gulf-coming-days-2026-09-07/",
                  "guard": "average of just 10 commodity vessels per day",
                  "text": "<b>ترافیک تنگه هرمز به پایین‌ترین سطح از ماه مه رسید</b>\n\nبر اساس داده‌های حمل‌ونقل دریایی مورد استناد رویترز، طی ۱۰ روز گذشته به‌طور میانگین فقط ۱۰ کشتی حامل کالا در روز از تنگه هرمز عبور کرده‌اند؛ پایین‌ترین سطح از ماه مه. کاهش تردد پس از دور تازه درگیری‌های دریایی آمریکا و ایران رخ داده است.\n\n🕒 زمان منبع: ۷ سپتامبر ۲۰۲۶، ۰۶:۵۷ UTC\n📌 <a href=\"https://www.reuters.com/world/middle-east/iran-says-announce-new-restricted-zone-gulf-coming-days-2026-09-07/\">منبع: Reuters</a>\n\n📡 <a href=\"https://t.me/bikhabaar\">بی‌خبر</a> ←\nمانیتور تحولات ایران",
              },
          ]

          sent = 0
          skipped = 0
          for post in posts:
              guard = post["guard"]
              if guard in channel_html or post["source"] in channel_html or html.escape(post["source"]) in channel_html:
                  print("SKIP_ALREADY_PRESENT", guard)
                  skipped += 1
                  continue
              endpoint = "sendPhoto" if post["kind"] == "photo" else "sendMessage"
              payload = {"chat_id": chat, "parse_mode": "HTML"}
              if post["kind"] == "photo":
                  payload.update({"photo": post["photo"], "caption": post["text"]})
              else:
                  payload.update({"text": post["text"], "disable_web_page_preview": True})
              response = requests.post(f"https://api.telegram.org/bot{token}/{endpoint}", json=payload, timeout=30)
              response.raise_for_status()
              data = response.json()
              if not data.get("ok"):
                  raise RuntimeError(f"Telegram rejected {guard}: {data}")
              print("PUBLISHED", guard, "message_id=", data.get("result", {}).get("message_id"))
              sent += 1
              channel_html += " " + guard + " " + post["source"]
          print(f"RECOVERY_DONE sent={sent} skipped={skipped}")
          PY
