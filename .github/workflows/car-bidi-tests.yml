name: Car Bidi Tests

on:
  push:
    branches:
      - fix/x-publish-all
    paths:
      - "src/cars.py"
      - "tests/test_car_bidi.py"
      - ".github/workflows/car-bidi-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_car_bidi.py
