name: Car Output Tests

on:
  push:
    branches:
      - fix/x-publish-all
    paths:
      - "src/cars.py"
      - "src/runtime_v4.py"
      - "assets/car_price_banner.svg"
      - "tests/test_car_bidi.py"
      - "tests/test_car_telegraph.py"
      - ".github/workflows/car-bidi-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_car_bidi.py tests/test_car_telegraph.py
