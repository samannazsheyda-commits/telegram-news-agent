name: Newsroom Audit CI

on:
  push:
    branches:
      - audit/newsroom-hardening-2026-09-05-final3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Full test suite
        run: python -m pytest -q
      - name: Repeat critical newsroom tests ten times
        run: |
          for i in $(seq 1 10); do
            echo "Critical audit pass $i/10"
            python -m pytest -q \
              tests/test_easy_news_flow.py \
              tests/test_fresh_x.py \
              tests/test_expanded_x_monitoring.py \
              tests/test_news_footer_icons.py \
              tests/test_news_output_layout.py \
              tests/test_workflow.py
          done
