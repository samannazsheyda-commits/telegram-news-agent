name: Republish Two Trump Iran Images

on:
  push:
    branches: [main]
    paths:
      - ".republish-two-trump-iran-images"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Republish exact two Trump Iran image posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: |
          python - <<'PY'
          import os, requests

          posts = [
              {
                  "photo": "https://truth-archive.us-iad-1.linodeobjects.com/attachments/17977/ef4da83f66017163-4c1b09bf9dd9.jpg",
                  "truth": "https://truthsocial.com/@realDonaldTrump/117206799377569441",
              },
              {
                  "photo": "https://truth-archive.us-iad-1.linodeobjects.com/attachments/17996/7a4f781a660b5225-dd943bbd0460.jpg",
                  "truth": "https://truthsocial.com/@realDonaldTrump/117225385560464439",
              },
          ]

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          for post in posts:
              caption = (
                  '<b>پست جدید ترامپ در تروت سوشال</b>\n\n'
                  f'📌 <a href="{post["truth"]}">لینک پست اصلی</a>\n\n'
                  '📡 <a href="https://t.me/bikhabaar">بی‌خبر</a> ←\n'
                  'مانیتور تحولات ایران'
              )
              res = requests.post(
                  f"https://api.telegram.org/bot{token}/sendPhoto",
                  json={"chat_id": chat, "photo": post["photo"], "caption": caption, "parse_mode": "HTML"},
                  timeout=30,
              )
              res.raise_for_status()
              data = res.json()
              if not data.get("ok"):
                  raise SystemExit(f"Telegram rejected {post['truth']}: {data}")
              print("REPUBLISHED", post["truth"])
          PY
