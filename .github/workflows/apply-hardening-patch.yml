name: Apply Hardening Patch

on:
  push:
    branches:
      - fix/news-delivery-hardening-2026-09-06
    paths:
      - "tools/apply_transactional_news_patch.py"
      - ".github/workflows/apply-hardening-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/apply_transactional_news_patch.py
      - run: |
          if git diff --quiet -- src/main.py tests/test_main.py; then
            echo "Patch already applied"
            exit 0
          fi
          git config user.name "news-hardening[bot]"
          git config user.email "news-hardening[bot]@users.noreply.github.com"
          git add src/main.py tests/test_main.py
          git commit -m "fix: make news publication transactional"
          git push origin HEAD:fix/news-delivery-hardening-2026-09-06
