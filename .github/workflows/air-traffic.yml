name: Middle East Air Traffic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".air-traffic-now"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: pip install -r requirements.txt
      - name: Build and publish the real live snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: python -m src.air_traffic --publish --output /tmp/iran-region-live-air-traffic.png
