name: Middle East Air Traffic

on:
  schedule:
    - cron: "30 8 * * *"   # 12:00 Tehran
    - cron: "30 16 * * *"  # 20:00 Tehran
    - cron: "30 20 * * *"  # 00:00 Tehran
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".air-traffic-initial-publish"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish live Middle East air traffic snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
        run: python -m src.air_traffic --publish
