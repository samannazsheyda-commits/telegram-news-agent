name: Middle East Air Traffic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".air-traffic-now"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer dependencies
        run: pip install -r requirements.txt
      - name: Build and publish strict live snapshot with Luna summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@bikhabaar"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: "https://1xai.ir/v1"
          OPENAI_MODEL: "gpt-5.6-luna"
          AI_NEWSROOM_MODE: "required"
        run: python -m src.air_traffic_publish_guard --publish --output /tmp/iran-region-live-air-traffic.png
