name: Hormuz Fix Tests

on:
  push:
    branches:
      - fix/hormuz-no-empty-post

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_hormuz_report.py
