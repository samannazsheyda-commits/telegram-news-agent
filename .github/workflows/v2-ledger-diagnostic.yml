name: V2 Ledger Diagnostic

on:
  push:
    branches:
      - diagnostic/v2-ledger-publish-state-2026-09-08

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List recent V2 Telegram publications
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path('data/event_ledger.json').read_text(encoding='utf-8'))
          rows = []
          for row in ledger:
              ids = [i for i in row.get('published_message_ids', []) if isinstance(i, int) and i >= 520]
              if ids:
                  rows.append({
                      'message_ids': ids,
                      'title': row.get('canonical_title'),
                      'source': row.get('primary_source'),
                      'status': row.get('status'),
                      'last_updated': row.get('last_updated'),
                  })
          rows.sort(key=lambda r: min(r['message_ids']))
          for row in rows:
              print('RECENT_PUBLICATION', json.dumps(row, ensure_ascii=False, sort_keys=True))
          print('RECENT_PUBLICATION_COUNT', len(rows))
          PY
