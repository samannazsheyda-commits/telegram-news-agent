name: X Publish All Tests

on:
  push:
    branches:
      - fix/x-publish-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_x_publish_all.py
